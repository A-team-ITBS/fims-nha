; NHA FIMS - PHP overrides for Docker (development)
; Loaded via mount into /usr/local/etc/php/conf.d/99-nha-fims.ini

; ---------------- General limits ----------------
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 100M
post_max_size = 100M
default_socket_timeout = 60

; ---------------- Error reporting (dev) ----------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

; ---------------- Realpath cache ----------------
; Massive win on Windows/Docker: caches resolved file paths so PHP doesn't
; stat the filesystem repeatedly for every include.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---------------- OPcache ----------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Timestamp checks are ON (dev): PHP re-checks a file's mtime at most once
; every `revalidate_freq` seconds, so edits reflect automatically within ~2s
; without needing `npm run reload`. This does cost extra filesystem stats on
; the Windows-drive (9p) bind mount; if requests feel sluggish, either raise
; revalidate_freq (e.g. 5) or set validate_timestamps = 0 again and go back to
; running `npm run reload` after each edit.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.save_comments = 1
opcache.jit_buffer_size = 64M
opcache.jit = tracing

; ---------------- Session ----------------
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.use_strict_mode = 1
