; NHA FIMS - PHP-FPM pool tuning for Docker
; Loaded via mount into /usr/local/etc/php-fpm.d/zz-nha-fims.conf

[www]
; Listen on the standard FPM port
listen = 9000

; Run pool as www-data (default in the official php:8.2-fpm image)
user = www-data
group = www-data

; ---------------- Process manager ----------------
; dynamic = spawn workers as needed within a range
pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

; ---------------- Timeouts ----------------
request_terminate_timeout = 300

; ---------------- Logging ----------------
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
access.format = "%R - %{HTTP_HOST}e %m %{REQUEST_URI}e - %s - %{mili}dms"
