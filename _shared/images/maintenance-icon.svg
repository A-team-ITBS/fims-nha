<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="waterGradient6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="white" stroke="#003876" stroke-width="2"/>
  
  <!-- Gear -->
  <path d="M50 30 L54 30 L55 35 L60 37 L64 34 L67 37 L64 41 L65 46 L70 47 L70 51 L65 52 L64 57 L67 61 L64 64 L60 61 L55 63 L54 68 L50 68 L49 63 L44 61 L40 64 L37 61 L40 57 L39 52 L34 51 L34 47 L39 46 L40 41 L37 37 L40 34 L44 37 L49 35 Z" 
        fill="url(#waterGradient6)">
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 50 50"
                      to="360 50 50"
                      dur="10s"
                      repeatCount="indefinite"/>
  </path>
  
  <!-- Water Drop -->
  <path d="M50 40 Q55 45 55 50 L45 50 Q45 45 50 40" 
        fill="#c41e3a">
    <animate attributeName="d" 
             values="M50 40 Q55 45 55 50 L45 50 Q45 45 50 40;
                     M50 42 Q57 47 57 52 L43 52 Q43 47 50 42;
                     M50 40 Q55 45 55 50 L45 50 Q45 45 50 40"
             dur="2s" 
             repeatCount="indefinite"/>
  </path>
  
  <!-- Center Circle -->
  <circle cx="50" cy="50" r="5" fill="white"/>
</svg>