server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 100M;

    # API: unknown paths fall back to api/index.php (mirrors web.config "api" rule)
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Everything else falls back to the root front controller (web.config "slim" rule)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
